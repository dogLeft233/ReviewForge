[project]
name = "reviewforge"
version = "0.1.0"
description = "Intelligent Paper Retrieval and Structured Enhancement Platform"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "openai>=2.33.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "mypy>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: test that requires LLM API (skipped without LLM_API_KEY)",
    "e2e: end-to-end test covering full planner workflow",
]
