# MetaSearcher 配置文件
# 环境变量引用格式: ${VAR_NAME}

sources:
  papers:
    - name: arxiv
      adapter: ArxivAdapter
      enabled: true
      max_results: 20
    - name: serper
      adapter: SerperAdapter
      enabled: true
      max_results: 20
      requires_key: true
  resources:
    - name: github
      adapter: GithubAdapter
      enabled: true
      max_results: 15
    - name: huggingface
      adapter: HuggingFaceAdapter
      enabled: true
      max_results: 15
  news:
    - name: bocha
      adapter: BochaAdapter
      enabled: true
      max_results: 15
    - name: hackernews
      adapter: HNAdapter
      enabled: true
      max_results: 10

fusion:
  method: rrf  # Reciprocal Rank Fusion
  k: 60        # RRF 平滑参数

dedup:
  normalize: true
  title_threshold: 0.85  # 标题相似度超过此值则去重

rerank:
  api_url: https://api.siliconflow.cn/v1/rerank
  model: BAAI/bge-reranker-v2-m3
  api_key: ${SILICONFLOW_API_KEY}
  top_n: 10
  timeout: 30